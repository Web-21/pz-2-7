<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра Числа</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="startScreen">
        <h1>Моя нова гра</h1>
        <button id="playButton">Розпочати</button>
    </div>

    <div id="mainGame" style="display: none;">
        <h2>Залишилось: <span id="timerDisplay">30</span> секунд</h2>
        <button id="resetButton">Перезапустити</button>
        <div id="gridArea" class="field-grid"></div>
    </div>

    <div id="scoreScreen" style="display: none;">
        <h2>Ваші результати</h2>
        <table>
            <thead>
                <tr><th>Гра</th><th>Час</th></tr>
            </thead>
            <tbody id="scoreTable"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
