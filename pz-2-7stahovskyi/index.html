<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PZ-2-7</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
</head>
<body>
    <div id="screen-1" class="screen">
        <h1 class="title">Моя перша гра</h1>
        <button id="start-button">Почати гру</button>
    </div>

    <div id="screen-2" class="screen hidden">
        <div class="timer">Залишилось: <span id="timer">30</span>s</div>
        <button id="restart-button">Почати з початку</button>
        <div id="game-board"></div>
    </div>

    <div id="not-cor" title="Error">
        <p>Не вірна цифра</p>
    </div>
    <div id="suc-cor" title="Congratulations">
        <p>Вітаю ви виграли</p>
    </div>

    <div id="screen-3" class="screen hidden">
        <h1>Результати</h1>
        <table id="results-table">
            <thead>
                <tr>
                    <th>Назва гри</th>
                    <th>Час</th>
                </tr>
            </thead><tbody></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
